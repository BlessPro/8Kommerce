name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkpay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linkpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: linkpay_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: database
      BILLING_RECURRING_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, fileinfo, gd, mbstring, pdo_pgsql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          mkdir -p storage/framework/{cache,sessions,views} storage/logs

      - name: Run PostgreSQL migrations
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run application tests
        run: php artisan test

      - name: Build frontend assets
        run: npm run build

      - name: Validate Laravel production caches
        run: |
          php artisan view:cache
          php artisan route:cache
          php artisan config:cache
          php artisan optimize:clear

      - name: Audit production PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Audit production JavaScript dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: Check PHP syntax
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find app bootstrap config database routes tests -type f -name '*.php' -print0)
          exit "$status"

      - name: Check whitespace errors
        run: git diff --check

  container:
    name: Production container
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: linkpay:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

